# /etc/nginx/nginx.conf

user nginx;

# Set number of worker processes automatically based on number of CPU cores.
worker_processes auto;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Configures default error logger.
error_log /var/log/nginx/error.log warn;

# Includes files with directives to load dynamic modules.
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 9.9.9.9 9.9.9.11 valid=300s;
    limit_req_zone $binary_remote_addr zone=flood:50m rate=90r/s;
    limit_conn_zone $binary_remote_addr zone=addr:50m;

    server_tokens off;

    sendfile on;
    tcp_nopush on;

    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    gzip_vary on;

    log_format main '$remote_addr [$time_iso8601] '
        'host="$host" '
        'server="$server_name" '
        '"$request" '
        'status=$status bytes=$body_bytes_sent '
        'ref="$http_referer" '
        'ua="$http_user_agent"';

    log_format json-logger escape=json '{
        "type": "access-log",
            "time": "$time_iso8601",
            "remote-ip": "$remote_addr",
            "x-forward-for": "$proxy_add_x_forwarded_for",
            "request-id": "$request_id",
            "request-length": "$request_length",
            "response-bytes": "$bytes_sent",
            "response-body-size": "$body_bytes_sent",
            "status": "$status",
            "vhost": "$host",
            "protocol": "$server_protocol",
            "path": "$uri",
            "query": "$args",
            "duration": "$request_time",
            "backend-duration": "$upstream_response_time",
            "backend-status": "$upstream_status",
            "method": "$request_method",
            "referer": "$http_referer",
            "user-agent": "$http_user_agent",
            "active-connections": "$connections_active"
        }';

    access_log /var/log/nginx/access.log main;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/http.d/*/*.conf;
}
