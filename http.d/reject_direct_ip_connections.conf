server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    return 444;
}

server {
    listen 443 default_server;
    listen [::]:443 default_server;
    server_name _;

    ssl_reject_handshake on;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    return 444;
}
